appId: dev.sharefront.warp
productName: Warp
copyright: MIT

directories:
  output: ../../release
  buildResources: ../../build

# Only the built output ships; sources and maps stay behind.
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
  - '!**/*.map'
  - '!dist/test/**'

asar: true
compression: normal

# Without this the scoped package name leaks into artifact filenames.
artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  # Without this the scoped package name becomes the binary name.
  executableName: warp
  category: Network
  synopsis: Send files and folders between your devices over the local network
  description: >-
    Finds your other devices on the network automatically and sends files or
    whole folders straight to them, with a queue you can pause, reorder and
    resume. Nothing leaves your network.
  icon: ../../build/icons
  desktop:
    entry:
      Name: Warp
      Comment: Share files across your network
      Keywords: file;share;transfer;network;lan;
      StartupWMClass: Warp
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]

deb:
  maintainer: share-front <noreply@sharefront.dev>
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils

win:
  icon: ../../build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Warp

mac:
  category: public.app-category.utilities
  icon: ../../build/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
